name: Deploy BioVault Demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-biovault
  cancel-in-progress: true

jobs:
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly secrets
        run: |
          flyctl secrets set \
            SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            SEARCH_TOKEN_SECRET="${{ secrets.SEARCH_TOKEN_SECRET }}" \
            DOWNLOAD_TOKEN_SECRET="${{ secrets.DOWNLOAD_TOKEN_SECRET }}" \
            CORS_ORIGINS="https://biovault-demo.fly.dev" \
            PUBLIC_URL="https://biovault-demo.fly.dev" \
            --app biovault-demo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --app biovault-demo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  pages-marketing:
    name: Marketing (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @biovault/marketing build
      - run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/client/"><title>BioVault</title></head><body><p><a href="/client/">Launch demo</a></p></body></html>' > apps/marketing/dist/demo.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
