services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - sentinel-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
      STAGING_PATH: /staging
      TAPE_ADAPTER: sim
      SESSION_SECRET: dev-compose-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      LOG_LEVEL: info
    volumes:
      - ../staging:/staging
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sentinel-mongo:
