openapi: 3.1.0
info:
  title: BioVault Sentinel API
  version: 0.1.0-mvp
  description: |
    Phase 1 metadata and job orchestration API. File bytes never returned inline;
    retrieval uses time-limited staging download URLs.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: system
  - name: auth
  - name: ingest
  - name: search
  - name: jobs
  - name: tapes
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie set (`sentinel_session`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End session
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Not authenticated
  /api/v1/clients/me:
    get:
      tags: [auth]
      summary: Current client tenant profile
      operationId: getClientProfile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfileResponse"
        "401":
          description: Not authenticated
        "403":
          description: Not a client user
  /api/v1/clients/me/onboarding:
    patch:
      tags: [auth]
      summary: Update onboarding stub (client admin)
      operationId: updateClientOnboarding
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfileResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/ingest/jobs:
    post:
      tags: [ingest]
      summary: Create ingest job from multipart file upload
      operationId: createIngestJob
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                category:
                  type: string
                  description: File category label (defaults to general)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Ingest job created and files indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
    get:
      tags: [ingest]
      summary: List ingest jobs for current client (not implemented — use GET by id)
      operationId: listIngestJobs
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Not implemented yet
  /api/v1/ingest/jobs/{jobId}:
    get:
      tags: [ingest]
      summary: Get ingest job status (client-visible; no tape location)
      operationId: getIngestJob
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingest job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobResponse"
        "404":
          description: Job not found
  /api/v1/ingest/jobs/{jobId}/report:
    get:
      tags: [ingest]
      summary: Get sealed ingest confirmation report
      operationId: getIngestReport
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingest confirmation report (sealed jobs only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestReportResponse"
        "404":
          description: Job not found or not yet sealed
  /api/v1/search/files:
    get:
      tags: [search]
      summary: Search indexed archived files (client metadata only)
      operationId: searchFiles
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          description: Filename or keyword token search (tenant-scoped HMAC tokens)
          schema:
            type: string
        - name: from
          in: query
          description: Ingest date lower bound (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ingest date upper bound (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: fileType
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching archived files (no tape location)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSearchResponse"
        "400":
          description: Invalid query parameters
  /api/v1/retrieval/jobs:
    post:
      tags: [jobs]
      summary: Request file retrieval (stub — Day 7)
      operationId: createRetrievalJob
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Not implemented yet
  /api/v1/admin/jobs:
    get:
      tags: [jobs]
      summary: List ops jobs with SLA (stub — Day 8)
      operationId: listAdminJobs
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Not implemented yet
  /api/v1/admin/tapes:
    get:
      tags: [tapes]
      summary: Tape inventory (stub — Day 10)
      operationId: listTapes
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Not implemented yet
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sentinel_session
  schemas:
    HealthResponse:
      type: object
      required: [status, version, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        dependencies:
          type: object
          properties:
            mongodb:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthUser:
      type: object
      required: [id, email, role, mfaEnabled]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - client_admin
            - client_viewer
            - compliance_officer
            - ops_admin
            - technician
        clientId:
          type: string
        mfaEnabled:
          type: boolean
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    ClientProfile:
      type: object
      required: [id, name, slug, tier, retentionPolicyYears, dataCategories, onboardingComplete]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        tier:
          type: string
          enum: [base, standard, enterprise]
        retentionPolicyYears:
          type: integer
        dataCategories:
          type: array
          items:
            type: string
        onboardingComplete:
          type: boolean
    ClientProfileResponse:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/ClientProfile"
    OnboardingUpdateRequest:
      type: object
      properties:
        dataCategories:
          type: array
          items:
            type: string
        retentionPolicyYears:
          type: integer
          minimum: 1
          maximum: 50
    ClientFileSearchResult:
      type: object
      description: Client-visible metadata only (no tape location)
      required: [id, filename, fileType, category, ingestedAt]
      properties:
        id:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        ingestedAt:
          type: string
          format: date-time
    AdminFileSearchResult:
      allOf:
        - $ref: "#/components/schemas/ClientFileSearchResult"
        - type: object
          properties:
            tapeBarcode:
              type: string
            rack:
              type: string
            slot:
              type: string
    FileSearchResponse:
      type: object
      description: Client file search results (no tape barcode, rack, or slot)
      required: [files, total]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ClientFileSearchResult"
        total:
          type: integer
          minimum: 0
    IngestFileSummary:
      type: object
      description: Indexed file metadata (no tape location)
      required: [id, filename, fileType, category, sizeBytes, checksumSha256, status]
      properties:
        id:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        sizeBytes:
          type: integer
        checksumSha256:
          type: string
        status:
          type: string
          enum: [indexing, on_tape, pending_deletion, deleted]
    IngestJobSummary:
      type: object
      description: Client-visible ingest job (no tape barcode/rack/slot)
      required: [id, status, fileCount, totalBytes, createdAt, files]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [received, indexing, writing, verifying, sealed, failed]
        fileCount:
          type: integer
        totalBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/IngestFileSummary"
    IngestJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/IngestJobSummary"
    IngestReportFile:
      allOf:
        - $ref: "#/components/schemas/IngestFileSummary"
        - type: object
          required: [verified]
          properties:
            verified:
              type: boolean
    IngestReport:
      type: object
      description: Client ingest confirmation after tape verify (no tape location)
      required: [jobId, status, fileCount, totalBytes, createdAt, files]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [sealed]
        fileCount:
          type: integer
        totalBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        sealedAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/IngestReportFile"
    IngestReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/IngestReport"
