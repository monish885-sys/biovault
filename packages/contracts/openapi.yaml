openapi: 3.1.0
info:
  title: BioVault Sentinel API
  version: 0.1.0-mvp
  description: |
    Phase 1 metadata and job orchestration API. File bytes never returned inline;
    retrieval uses time-limited staging download URLs.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: system
  - name: auth
  - name: ingest
  - name: search
  - name: jobs
  - name: tapes
  - name: audit
  - name: certificates
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie set (`sentinel_session`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End session
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Not authenticated
  /api/v1/clients/me:
    get:
      tags: [auth]
      summary: Current client tenant profile
      operationId: getClientProfile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfileResponse"
        "401":
          description: Not authenticated
        "403":
          description: Not a client user
  /api/v1/clients/me/onboarding:
    patch:
      tags: [auth]
      summary: Update onboarding stub (client admin)
      operationId: updateClientOnboarding
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfileResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/ingest/jobs:
    post:
      tags: [ingest]
      summary: Create ingest job from multipart file upload
      operationId: createIngestJob
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                category:
                  type: string
                  description: File category label (defaults to general)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Ingest job created and files indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
    get:
      tags: [ingest]
      summary: List ingest jobs for current client (not implemented — use GET by id)
      operationId: listIngestJobs
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Not implemented yet
  /api/v1/ingest/jobs/{jobId}:
    get:
      tags: [ingest]
      summary: Get ingest job status (client-visible; no tape location)
      operationId: getIngestJob
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingest job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobResponse"
        "404":
          description: Job not found
  /api/v1/ingest/jobs/{jobId}/report:
    get:
      tags: [ingest]
      summary: Get sealed ingest confirmation report
      operationId: getIngestReport
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingest confirmation report (sealed jobs only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestReportResponse"
        "404":
          description: Job not found or not yet sealed
  /api/v1/ingest/jobs/{jobId}/certificate:
    get:
      tags: [certificates]
      summary: Get ingest confirmation certificate metadata
      operationId: getIngestCertificate
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certificate metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "404":
          description: Certificate not found
    post:
      tags: [certificates]
      summary: Issue signed ingest confirmation PDF certificate
      operationId: issueIngestCertificate
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "404":
          description: Ingest job not found or not sealed
  /api/v1/ingest/jobs/{jobId}/certificate/download:
    get:
      tags: [certificates]
      summary: Download signed ingest confirmation PDF
      operationId: downloadIngestCertificate
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed PDF certificate
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Certificate not found
  /api/v1/audit/export:
    get:
      tags: [audit]
      summary: Export tenant-scoped audit trail (client compliance)
      operationId: exportClientAuditTrail
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Immutable audit export with hash chain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/admin/audit/events:
    get:
      tags: [audit]
      summary: List audit events (ops)
      operationId: listAuditEvents
      security:
        - cookieAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/admin/audit/export:
    get:
      tags: [audit]
      summary: Export full audit trail with hash chain verification
      operationId: exportAdminAuditTrail
      security:
        - cookieAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/search/files:
    get:
      tags: [search]
      summary: Search indexed archived files (client metadata only)
      operationId: searchFiles
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          description: Filename or keyword token search (tenant-scoped HMAC tokens)
          schema:
            type: string
        - name: from
          in: query
          description: Ingest date lower bound (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ingest date upper bound (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: fileType
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching archived files (no tape location)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSearchResponse"
        "400":
          description: Invalid query parameters
  /api/v1/retrieval/jobs:
    post:
      tags: [jobs]
      summary: Request file retrieval
      operationId: createRetrievalJob
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRetrievalJobRequest"
      responses:
        "201":
          description: Retrieval job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalJobResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
        "404":
          description: File not found
    get:
      tags: [jobs]
      summary: List retrieval jobs for current client (tracker)
      operationId: listRetrievalJobs
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, ready, delivered, expired, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Client retrieval jobs (no tape location)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalJobListResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/retrieval/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get retrieval job status for current client
      operationId: getRetrievalJob
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieval job detail (no tape location)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalJobResponse"
        "404":
          description: Job not found
  /api/v1/retrieval/download:
    get:
      tags: [jobs]
      summary: Download retrieved file via signed time-limited token
      operationId: downloadRetrievalFile
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: HMAC-signed download token issued when job is ready
      responses:
        "200":
          description: File stream (application/octet-stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or expired token
        "404":
          description: Staged file not found
  /api/v1/admin/jobs:
    get:
      tags: [jobs]
      summary: List ops retrieval jobs with SLA countdown
      operationId: listAdminJobs
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, ready, delivered, expired, failed]
        - name: overdue
          in: query
          description: When true, only active jobs past dueAt
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Internal ops job queue with tape location and SLA timers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobListResponse"
        "400":
          description: Invalid query parameters
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
  /api/v1/admin/jobs/{jobId}:
    patch:
      tags: [jobs]
      summary: Update retrieval job status (assign, in_progress)
      operationId: updateAdminRetrievalJob
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminRetrievalJobRequest"
      responses:
        "200":
          description: Updated job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRetrievalJobStatusResponse"
        "400":
          description: Invalid status transition
        "404":
          description: Job not found
  /api/v1/admin/jobs/{jobId}/complete:
    post:
      tags: [jobs]
      summary: Complete retrieval — copy from tape to staging and issue download link
      operationId: completeAdminRetrievalJob
      security:
        - cookieAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job ready with signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteRetrievalJobResponse"
        "400":
          description: Job not in completable state
        "404":
          description: Job not found
  /api/v1/admin/tapes:
    get:
      tags: [tapes]
      summary: Tape inventory with fill percent and health scores
      operationId: listTapes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tape inventory for ops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TapeListResponse"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sentinel_session
  schemas:
    HealthResponse:
      type: object
      required: [status, version, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        dependencies:
          type: object
          properties:
            mongodb:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthUser:
      type: object
      required: [id, email, role, mfaEnabled]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - client_admin
            - client_viewer
            - compliance_officer
            - ops_admin
            - technician
        clientId:
          type: string
        mfaEnabled:
          type: boolean
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    ClientProfile:
      type: object
      required: [id, name, slug, tier, retentionPolicyYears, dataCategories, onboardingComplete]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        tier:
          type: string
          enum: [base, standard, enterprise]
        retentionPolicyYears:
          type: integer
        dataCategories:
          type: array
          items:
            type: string
        onboardingComplete:
          type: boolean
    ClientProfileResponse:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/ClientProfile"
    OnboardingUpdateRequest:
      type: object
      properties:
        dataCategories:
          type: array
          items:
            type: string
        retentionPolicyYears:
          type: integer
          minimum: 1
          maximum: 50
    ClientFileSearchResult:
      type: object
      description: Client-visible metadata only (no tape location)
      required: [id, filename, fileType, category, ingestedAt]
      properties:
        id:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        ingestedAt:
          type: string
          format: date-time
    AdminFileSearchResult:
      allOf:
        - $ref: "#/components/schemas/ClientFileSearchResult"
        - type: object
          properties:
            tapeBarcode:
              type: string
            rack:
              type: string
            slot:
              type: string
    FileSearchResponse:
      type: object
      description: Client file search results (no tape barcode, rack, or slot)
      required: [files, total]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ClientFileSearchResult"
        total:
          type: integer
          minimum: 0
    IngestFileSummary:
      type: object
      description: Indexed file metadata (no tape location)
      required: [id, filename, fileType, category, sizeBytes, checksumSha256, status]
      properties:
        id:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        sizeBytes:
          type: integer
        checksumSha256:
          type: string
        status:
          type: string
          enum: [indexing, on_tape, pending_deletion, deleted]
    IngestJobSummary:
      type: object
      description: Client-visible ingest job (no tape barcode/rack/slot)
      required: [id, status, fileCount, totalBytes, createdAt, files]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [received, indexing, writing, verifying, sealed, failed]
        fileCount:
          type: integer
        totalBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/IngestFileSummary"
    IngestJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/IngestJobSummary"
    IngestReportFile:
      allOf:
        - $ref: "#/components/schemas/IngestFileSummary"
        - type: object
          required: [verified]
          properties:
            verified:
              type: boolean
    IngestReport:
      type: object
      description: Client ingest confirmation after tape verify (no tape location)
      required: [jobId, status, fileCount, totalBytes, createdAt, files]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [sealed]
        fileCount:
          type: integer
        totalBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        sealedAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/IngestReportFile"
    IngestReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/IngestReport"
    CreateRetrievalJobRequest:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
          description: Indexed file identifier (must be on_tape)
    ClientRetrievalJobSummary:
      type: object
      description: Client-visible retrieval job (no tape barcode, rack, or slot)
      required:
        - id
        - fileId
        - filename
        - fileType
        - category
        - status
        - dueAt
        - createdAt
        - slaRemainingSeconds
        - slaOverdue
      properties:
        id:
          type: string
        fileId:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [pending, assigned, in_progress, ready, delivered, expired, failed]
        dueAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        slaRemainingSeconds:
          type: integer
          description: Seconds until SLA deadline (negative when overdue)
        slaOverdue:
          type: boolean
        downloadUrl:
          type: string
          description: Signed download path when status is ready
        downloadExpiresAt:
          type: string
          format: date-time
          description: Download link expiry when status is ready
    RetrievalJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/ClientRetrievalJobSummary"
    RetrievalJobListResponse:
      type: object
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/ClientRetrievalJobSummary"
        total:
          type: integer
          minimum: 0
    AdminTapeLocation:
      type: object
      required: [tapeBarcode, rack, slot]
      properties:
        tapeBarcode:
          type: string
        rack:
          type: string
        slot:
          type: string
    AdminRetrievalJobSummary:
      type: object
      description: Internal ops view with tape location and SLA countdown
      required:
        - id
        - clientId
        - clientName
        - fileId
        - filename
        - fileType
        - category
        - status
        - dueAt
        - createdAt
        - slaRemainingSeconds
        - slaOverdue
        - requestedBy
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        fileId:
          type: string
        filename:
          type: string
        fileType:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [pending, assigned, in_progress, ready, delivered, expired, failed]
        dueAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        slaRemainingSeconds:
          type: integer
        slaOverdue:
          type: boolean
        requestedBy:
          type: string
          description: Requester email or user id
        assignedTo:
          type: string
          description: Assignee email when set
        tape:
          $ref: "#/components/schemas/AdminTapeLocation"
    AdminJobListResponse:
      type: object
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AdminRetrievalJobSummary"
        total:
          type: integer
          minimum: 0
    UpdateAdminRetrievalJobRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [assigned, in_progress]
    AdminRetrievalJobStatusResponse:
      type: object
      required: [job]
      properties:
        job:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
    CompleteRetrievalJobResponse:
      type: object
      required: [job]
      properties:
        job:
          type: object
          required: [id, status, downloadUrl, downloadExpiresAt]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [ready]
            downloadUrl:
              type: string
            downloadExpiresAt:
              type: string
              format: date-time
    AdminTapeSummary:
      type: object
      required:
        - barcode
        - rack
        - slot
        - status
        - fillPercent
        - healthScore
        - writeCycles
        - ageDays
        - createdAt
        - updatedAt
      properties:
        barcode:
          type: string
        rack:
          type: string
        slot:
          type: string
        status:
          type: string
          enum: [empty, writing, active, full, retired]
        fillPercent:
          type: number
          minimum: 0
          maximum: 100
        healthScore:
          type: string
          enum: [green, amber, red]
        writeCycles:
          type: integer
          minimum: 0
        ageDays:
          type: integer
          minimum: 0
        purchasedAt:
          type: string
          format: date-time
        sealedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TapeListResponse:
      type: object
      required: [tapes, total]
      properties:
        tapes:
          type: array
          items:
            $ref: "#/components/schemas/AdminTapeSummary"
        total:
          type: integer
          minimum: 0
    AuditEventSummary:
      type: object
      required: [id, action, payload, payloadHash, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
        userId:
          type: string
        clientId:
          type: string
        ipAddress:
          type: string
        payload:
          type: object
          additionalProperties: true
        payloadHash:
          type: string
        prevHash:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditEventListResponse:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventSummary"
        total:
          type: integer
          minimum: 0
    AuditExportResponse:
      type: object
      required: [exportedAt, chainValid, eventCount, events]
      properties:
        exportedAt:
          type: string
          format: date-time
        chainValid:
          type: boolean
        eventCount:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventSummary"
    CertificateSummary:
      type: object
      required: [id, type, clientId, ingestJobId, pdfSha256, issuedAt, metadata]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ingest_summary, deletion_confirmation, audit_export]
        clientId:
          type: string
        ingestJobId:
          type: string
        pdfSha256:
          type: string
        issuedAt:
          type: string
          format: date-time
        metadata:
          type: object
          required: [algorithm, signature, contentHash, fileCount, totalBytes]
          properties:
            algorithm:
              type: string
            signature:
              type: string
            contentHash:
              type: string
            fileCount:
              type: integer
            totalBytes:
              type: integer
    CertificateResponse:
      type: object
      required: [certificate]
      properties:
        certificate:
          $ref: "#/components/schemas/CertificateSummary"
